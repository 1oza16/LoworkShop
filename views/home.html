<div class="section-header section-header-more" id="summary">RESUMEN</div>
<div class="section-box">
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-num" id="stat-total">—</div>
            <div class="stat-label">Total hojas guardadas</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" id="stat-mes">—</div>
            <div class="stat-label">Modificadas este mes</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" id="stat-ultima">—</div>
            <div class="stat-label">Última modificada</div>
        </div>
    </div>
</div>

<div class="section-header">ACCIONES RÁPIDAS</div>
<div class="section-box">
    <div class="acciones-grid">
        <button class="btn-accion" id="btn-abrir-modal">
                <img src="img/icons/sheet1.png" alt="loworkshop_sheet" class="icon">
            <div>
                <div class="accion-titulo">Nueva hoja</div>
                <div class="accion-desc">Crear hoja de presupuesto y reparación en blanco</div>
            </div>
        </button>
        <button class="btn-accion" id="btn-recargar">
                <img src="img/icons/reload1.png" alt="reload" class="icon">
            <div>
                <div class="accion-titulo">Actualizar lista</div>
                <div class="accion-desc">Recargar las hojas desde la carpeta seleccionada</div>
            </div>
        </button>
    </div>
</div>

<div class="section-header section-header-more" id="sheets">HOJAS GUARDADAS</div>
<div class="section-box">
    <div class="buscador-wrap">
        <img src="img/icons/tracker.png" alt="reload" class="icon">
        <input type="text" id="buscador" placeholder="Buscar por nombre de hoja…">
    </div>
    <div id="lista-hojas" class="lista-hojas-home">
        <div class="estado-vacio">
        </div>
    </div>
</div>

<!-- MODAL NEW SHEET -->
<div class="modal-overlay" id="overlay-new-sheet">
    <div class="modal-box">
        <div class="modal-header">
            <div class="marco-icono">
                <img src="img/favicon.ico" alt="isologo" width="30px">
            </div>
            
            <h3>NUEVA HOJA DE PRESUPUESTO Y REPARACIÓN</h3>
        </div>

        <div class="modal-body">
            <div class="campo-grupo">
                <label class="campo-label" for="inp-cliente">Nombre del cliente</label>
                <select class="campo-input" id="inp-cliente">
                    <option value="">Seleccionar cliente</option>
                </select>
            </div>
            <div class="campo-grupo">
                <label class="campo-label" for="inp-matricula">Matrícula del vehículo</label>
                <input type="text" class="campo-input" id="inp-matricula" placeholder="3333 XXX">
            </div>
            <div class="campo-grupo">
                <label class="campo-label" for="inp-marca">Marca del vehículo</label>
                <select class="campo-input" id="inp-marca">
                    <option value="">Seleccionar marca</option>
                </select>
            </div>
            <div class="campo-grupo">
                <label class="campo-label" for="inp-modelo">Modelo del vehículo</label>
                <select class="campo-input" id="inp-modelo" disabled>
                    <option value="">Seleccionar modelo</option>
                </select>
            </div>
            <div class="campo-grupo">
                <label class="campo-label" for="inp-kilometraje">Kilometraje</label>
                <div class="kilometraje-value">
                    <input type="number" class="campo-input kilometraje-input" id="inp-kilometraje" min="0" step="1" placeholder="Introduce kilometraje">
                    <select class="campo-input kilometraje-unit" id="unidadKilometraje" aria-label="Unidad de kilometraje">
                        <option value="km" selected>km</option>
                        <option value="millas">millas</option>
                    </select>
                </div>
            </div>
            <div class="campo-grupo">
                <label class="campo-label" for="inp-fecha">Fecha de reparación</label>
                <input type="date" class="campo-input" id="inp-fecha">
            </div>

            <div class="preview-nombre" id="preview-nombre"></div>

            <div class="modal-footer">
                <button class="btn-cancel" id="btn-cerrar-modal">Cancelar</button>
                <button class="btn-primary" id="btn-crear-hoja">Crear hoja</button>
            </div>
        </div>
    </div>
</div>
