<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/common/variables.css">
    <link rel="stylesheet" href="assets/common/common.css">
    <link rel="stylesheet" href="assets/index/index.css">
    <link rel="stylesheet" href="assets/index/home.css">
    <link rel="stylesheet" href="assets/index/sheets.css">
    <link rel="stylesheet" href="assets/index/album.css">
    <link rel="stylesheet" href="assets/index/statistics.css">
    <link rel="stylesheet" href="assets/index/database.css">
    <link rel="stylesheet" href="assets/index/calendar.css">
    <title>LoworkShop - Panel Principal</title>
</head>
<body>

    <div class="header">
        <img src="img/isologo.png" alt="Lozano Workshop" class="logo" onclick="changeView('home')">
        <div class="header-titulo">
            <h1>LoworkShop</h1>
        </div>
    </div>

    <div class="barra-estado">
        <div class="estado-texto">
            <button id="btnMenu" class="menu-toggle" onclick="toggleSidebar()">
                <img src="img/icons/menu.png" alt="panel_principal" class="icon">
            </button>
            <h3 id="texto-estado">Pestaña sin seleccionar</h3>
        </div>
        <div class="usuario">
            <img src="img/icons/user.png" alt="" class="icon">
            <span>Usuario</span>
        </div>
    </div>

    <div class="app-container">
        <aside id="sidebar">
            <button onclick="changeView('home')" id="home">
                <img src="img/icons/home.png" alt="panel_principal" class="icon">
                <span>Inicio</span>
            </button>
            <button onclick="changeView('sheets')" id="sheets">
                <img src="img/icons/sheets.png" alt="panel_principal" class="icon">
                <span>Hojas</span>
            </button>
            <button onclick="changeView('album')" id="album">
                <img src="img/icons/album.png" alt="panel_principal" class="icon">
                <span>Álbum</span>
            </button>
            <button onclick="changeView('calendar')" id="calendar">
                <img src="img/icons/calendar.png" alt="panel_principal" class="icon">
                <span>Calendario</span>
            </button>
            <button onclick="changeView('statistics')" id="statistics">
                <img src="img/icons/statistics.png" alt="panel_principal" class="icon">
                <span>Estadísticas</span>
            </button>
            <button onclick="changeView('database')" id="database">
                <img src="img/icons/database.png" alt="panel_principal" class="icon">
                <span>Base de Datos</span>
            </button>
            <button onclick="changeView('settings')" id="settings">
                <img src="img/icons/settings.png" alt="panel_principal" class="icon">
                <span>Configuración</span>
            </button>
        </aside>

        <main id="mainContent">
        </main>
    </div>
</div>

<script src="assets/common/api.js"></script>
<script src="assets/common/common.js"></script>
<script src="assets/index/home.js"></script>
<script src="assets/index/sheets.js"></script>
<script src="assets/index/album.js"></script>
<script src="assets/vendor/fullcalendar.global.min.js"></script>
<script src="assets/vendor/fullcalendar-locales-all.global.min.js"></script>
<script src="assets/index/calendar.js"></script>
<script src="assets/index/settings.js"></script>
<script src="assets/vendor/chart.umd.min.js"></script>
<script src="assets/index/statistics.js"></script>
<script src="assets/index/database.js"></script>
<script src="assets/index/index.js"></script>
</body>
</html>
