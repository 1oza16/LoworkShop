<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/hoja.css">
    <script src="../assets/hoja.js"></script>
    <title>LoworkShop_{CLIENTE}_{MATRICULA}</title>
</head>

<body>
    <div class="header">
        
        <img src="../img/isologo.png" alt="Lozano Workshop" class="logo">
        <div>
            <img src="" alt="" class="model" id="modelImg" onclick="abrirModalCoches()">
            <input type="file" id="modelUpload" accept="image/*" onchange="changeLogo(event)" style="display:none;">
            <label class="model-upload-label" onclick="abrirModalCoches()" style="cursor:pointer;">Cambiar foto de modelo</label>
        </div>
    </div>
    
    <!-- Album fotos coches -->
    <div class="modal-overlay" id="modalCoches" onclick="if(event.target===this) cerrarModalCoches()">
        <div class="modal-box">
            <button class="modal-close" onclick="cerrarModalCoches()">&times;</button>
            <h3>Biblioteca de vehículos</h3>

            <div class="modal-field">
                <label for="selectMarca">Marca</label>
                <select id="selectMarca" onchange="onMarcaChange()">
                    <option value="">-- Selecciona --</option>
                </select>
            </div>
º
            <div class="modal-field">
                <label for="selectModelo">Modelo</label>
                <select id="selectModelo" onchange="onModeloChange()" disabled>
                    <option value="">-- Selecciona --</option>
                </select>
            </div>

            <div class="modal-field">
                <label>Vista previa</label>
                <div class="modal-preview" id="modalPreview">
                    <span>imagen</span>
                </div>
            </div>

            <div class="modal-thumbs" id="modalThumbs"></div>

            <button class="btn-cancel" onclick="cerrarModalCoches()">Cancelar</button>
            <button class="modal-select-btn" id="btnSeleccionarFoto" disabled onclick="confirmarSeleccionFoto()">Seleccionar</button>
        </div>
    </div>

    <div class="document-title">
        NOTA INFORMATIVA DE PRESUPUESTO Y REPARACIÓN
    </div>  
    
    <div class="section">
        <div class="section-header">INFORMACIÓN DEL CLIENTE Y VEHÍCULO</div>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">NOMBRE DEL CLIENTE:</div>
                <input type="text" class="info-value" id="cliente" value="{CLIENTE}">
            </div>
            <div class="info-item">
                <div class="info-label">FECHA:</div>
                <input type="date" class="info-value" id="fecha" value="{FECHA}">
            </div>
            <div class="info-item">
                <div class="info-label">MODELO DEL VEHÍCULO:</div>
                <input type="text" class="info-value">
            </div>
            <div class="info-item">
                <div class="info-label">MATRÍCULA:</div>
                <input type="text" class="info-value" id="matricula" value="{MATRICULA}">
            </div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">DESCRIPCIÓN DE REPARACIONES O TRABAJOS A REALIZAR</div>
        <div class="toolbar">
            <button onclick="document.execCommand('bold')"><b>Negrita</b></button>
            <button onclick="document.execCommand('italic')"><i>Cursiva</i></button>
            <button onclick="document.execCommand('underline')"><u>Subrayado</u></button>
            <button onclick="document.execCommand('insertUnorderedList')">• Lista</button>
            <button onclick="document.execCommand('insertOrderedList')">1. Lista Numerada</button>
        </div>
        <div class="editable-box" contenteditable="true" id="reparaciones">
            <!-- Espacio para escribir las reparaciones realizadas -->
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">MATERIALES NECESARIOS</div>
        <div class="toolbar">
            <button onclick="document.execCommand('bold')"><b>Negrita</b></button>
            <button onclick="document.execCommand('italic')"><i>Cursiva</i></button>
            <button onclick="document.execCommand('underline')"><u>Subrayado</u></button>
            <button onclick="document.execCommand('insertUnorderedList')">• Lista</button>
            <button onclick="document.execCommand('insertOrderedList')">1. Lista Numerada</button>
        </div>
        <div class="editable-box" contenteditable="true" id="materiales">
            <!-- Espacio para escribir los materiales utilizados -->
        </div>
    </div>
    
    <div class="precio-section">
        <button class="toggle-mano-obra" onclick="toggleManoObra()">
            Mostrar/Ocultar Mano de Obra
        </button>
        
        <div class="mano-obra-container" id="manoObraSection" style="display: block;">
            <strong>Mano de obra:</strong> <input type="text" class="precio-input" placeholder="Introduce importe">
        </div>
        
        <div class="precio-total">
            TOTAL: <input type="text" class="precio-total-input" placeholder="Introduce total">
        </div>
    </div>

    <button class="print-button" onclick="window.print()">Imprimir</button>
    <button class="clear-button" onclick="clearForm()">Limpiar Formulario</button>

</body>
</html>
