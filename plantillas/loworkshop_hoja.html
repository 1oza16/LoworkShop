<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <title>LoworkShop_{CLIENTE}_{MATRICULA}</title>
    <style>
        @page {
            size: A4;
            margin: 1cm;
        }
        
        body {
            font-family: 'Calibri', 'Arial', sans-serif;
            max-width: 21cm;
            margin: 0 auto;
            padding: 5px;
            background: white;
            color: #333;
        }
        
        .header {
            display: block;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #c41e3a;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            max-width: 300px;
            height: auto;
            margin: 0px;
        }
        
        .model {
            max-width: 120px;
            height: auto;
            cursor: pointer;
            border: 2px dashed transparent;
            transition: border 0.3s;
        }

        .model:hover {
            border: 2px dashed #1e5aa8;
        }

        #modelUpload {
            display: none;  /* Oculta el input feo de archivo */
        }

        .model-upload-label {
            display: block;
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            cursor: pointer;
        }

        .model-upload-label:hover {
            color: #1e5aa8;
        }

        .title-section {
            text-align: right;
        }
        
        .title-section h1 {
            color: #1e5aa8;
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }
        
        .title-section p {
            color: #1e5aa8;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        
        .document-title {
            background-color: #2d5016;
            color: white;
            padding: 10px 15px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        
        .section {
            margin-bottom: 25px;
            page-break-inside: auto;
        }
        
        .section-header {
            background-color: #1e5aa8;
            color: white;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .info-item {
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        
        .info-label {
            font-weight: bold;
            color: #2d5016;
            font-size: 12px;
            margin-bottom: 3px;
        }
        
        .info-value {
            font-size: 14px;
            min-height: 20px;
            border: none;
            background: transparent;
            width: 100%;
            padding: 2px;
        }
        
        .info-value:focus {
            outline: 1px solid #1e5aa8;
            background-color: #f9f9f9;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .editable-box {
            border: 1px solid #ddd;
            padding: 7px;
            min-height: 25px;
            background-color: #fafafa;
            font-size: 13px;
            line-height: 1.6;
            overflow: visible;        /* añade esto */
            word-wrap: break-word;    /* y esto por si acaso */
        }
        
        .editable-box:focus {
            outline: 2px solid #1e5aa8;
            background-color: white;
        }
        
        .toolbar {
            background-color: #f0f0f0;
            padding: 8px;
            margin-bottom: 5px;
            border: 1px solid #ddd;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .toolbar button {
            background-color: white;
            border: 1px solid #ccc;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 3px;
        }
        
        .toolbar button:hover {
            background-color: #e8e8e8;
        }
        
        .toolbar button.active {
            background-color: #1e5aa8;
            color: white;
        }
        
        .precio-section {
            margin-top: 30px;
            text-align: right;
            page-break-inside: avoid
        }
        
        .mano-obra-container {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .toggle-mano-obra {
            background-color: #1e5aa8;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 3px;
            margin-bottom: 10px;
            display: block;
        }
        
        .toggle-mano-obra:hover {
            background-color: #2d5016;
        }
        
        .precio-total {
            display: inline-block;
            background-color: #2d5016;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .precio-input {
            border: none;
            border-bottom: 1px solid #333;
            background: transparent;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            width: 150px;
            padding: 2px;
        }
        
        .precio-input:focus {
            outline: none;
            border-bottom: 2px solid #1e5aa8;
            background-color: #f9f9f9;
        }
        
        .precio-total-input {
            border: none;
            background: transparent;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            width: 200px;
        }
        
        .precio-total-input:focus {
            outline: 2px solid white;
        }
        
        .clear-button {
            background-color: #c41e3a;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px auto;
            display: block;
        }

        .clear-button:hover {
            background-color: #a01528;
        }

        .print-button {
            background-color: #2d5016;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 35px auto;
            display: block;
        }

        .print-button:hover {
            background-color: #1e5aa8;
        }

        @media print {
            body {
                padding: 0;
            }
            .toolbar {
                display: none;
            }
            .print-button {
                display: none;
            }
            .toggle-mano-obra {
                display: none;
            }
            .model-upload-label {
                display: none;
            }
            .clear-button {
                display: none;
            }
            .model {
                border: none !important;
            }
            .editable-box {
                overflow: visible;
                height: auto;
                page-break-inside: auto;
            }
            .section {
                page-break-inside: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="../img/isologo.png" alt="Lozano Workshop" class="logo">

        <div>
            <img src="" alt="" class="model" id="modelImg" onclick="document.getElementById('modelUpload').click()">
            <input type="file" id="modelUpload" accept="image/*" onchange="changeLogo(event)">
            <label for="modelUpload" class="model-upload-label">Cambiar foto de modelo</label>
        </div>
    </div>
    
    <div class="document-title">
        NOTA INFORMATIVA DE PRESUPUESTO Y REPARACIÓN
    </div>  
    
    <div class="section">
        <div class="section-header">INFORMACIÓN DEL CLIENTE Y VEHÍCULO</div>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">NOMBRE DEL CLIENTE:</div>
                <input type="text" class="info-value" id="cliente" value="{CLIENTE}">
            </div>
            <div class="info-item">
                <div class="info-label">FECHA:</div>
                <input type="date" class="info-value" id="fecha" value="{FECHA}">
            </div>
            <div class="info-item">
                <div class="info-label">MODELO DEL VEHÍCULO:</div>
                <input type="text" class="info-value">
            </div>
            <div class="info-item">
                <div class="info-label">MATRÍCULA:</div>
                <input type="text" class="info-value" id="matricula" value="{MATRICULA}">
            </div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">DESCRIPCIÓN DE REPARACIONES O TRABAJOS A REALIZAR</div>
        <div class="toolbar">
            <button onclick="document.execCommand('bold')"><b>Negrita</b></button>
            <button onclick="document.execCommand('italic')"><i>Cursiva</i></button>
            <button onclick="document.execCommand('underline')"><u>Subrayado</u></button>
            <button onclick="document.execCommand('insertUnorderedList')">• Lista</button>
            <button onclick="document.execCommand('insertOrderedList')">1. Lista Numerada</button>
        </div>
        <div class="editable-box" contenteditable="true" id="reparaciones">
            <!-- Espacio para escribir las reparaciones realizadas -->
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">MATERIALES NECESARIOS</div>
        <div class="toolbar">
            <button onclick="document.execCommand('bold')"><b>Negrita</b></button>
            <button onclick="document.execCommand('italic')"><i>Cursiva</i></button>
            <button onclick="document.execCommand('underline')"><u>Subrayado</u></button>
            <button onclick="document.execCommand('insertUnorderedList')">• Lista</button>
            <button onclick="document.execCommand('insertOrderedList')">1. Lista Numerada</button>
        </div>
        <div class="editable-box" contenteditable="true" id="materiales">
            <!-- Espacio para escribir los materiales utilizados -->
        </div>
    </div>
    
    <div class="precio-section">
        <button class="toggle-mano-obra" onclick="toggleManoObra()">
            Mostrar/Ocultar Mano de Obra
        </button>
        
        <div class="mano-obra-container" id="manoObraSection" style="display: block;">
            <strong>Mano de obra:</strong> <input type="text" class="precio-input" placeholder="Introduce importe">
        </div>
        
        <div class="precio-total">
            TOTAL: <input type="text" class="precio-total-input" placeholder="Introduce total">
        </div>
    </div>

    <script>
        function toggleManoObra() {
            const section = document.getElementById('manoObraSection');
            if (section.style.display === 'none') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        function changeLogo(event) {
            const file = event.target.files[0];  // Obtiene el archivo seleccionado
            if (file) {
                const reader = new FileReader();  // Crea un lector de archivos
                reader.onload = function(e) {
                    document.getElementById('modelImg').src = e.target.result;  // Cambia el src del img
                };
                reader.readAsDataURL(file);  // Lee el archivo como Data URL (base64)
            }
        }

        // Auto-guardar cada cambio
        function setupAutoSave() {
            // IDs que necesitan ser únicos para cada input
            document.querySelectorAll('input').forEach((input, index) => {
                if(!input.id) input.id = 'input_' + index;

                input.addEventListener('input', function() {
                    localStorage.setItem('taller_' + this.id, this.value);
                });
            });

            // Guardar áreas editables
            document.querySelectorAll('[contenteditable="true"]').forEach(editable => {
                editable.addEventListener('input', function() {
                    localStorage.setItem('taller_' + this.id, this.innerHTML);
                });
            });
        }

        // Cargar datos guardados
        function loadData() {
            document.querySelectorAll('input').forEach((input, index) => {
                if(!input.id) input.id = 'input_' + index;
                const saved = localStorage.getItem('taller_' + input.id);
                if(saved) input.value = saved;
            });

            document.querySelectorAll('[contenteditable="true"]').forEach(editable => {
                const saved = localStorage.getItem('taller_' + editable.id);
                if(saved) editable.innerHTML = saved;
            });
        }

        // Limpiar todo
        function clearForm() {
            if(confirm('¿Seguro que quieres borrar todos los datos del formulario?')) {
                // Limpiar localStorage
                Object.keys(localStorage).forEach(key => {
                    if(key.startsWith('taller_')) {
                        localStorage.removeItem(key);
                    }
                });
                location.reload();
            }
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupAutoSave();
        });
    </script>

    <button class="print-button" onclick="window.print()">Imprimir</button>
    <button class="clear-button" onclick="clearForm()">Limpiar Formulario</button>

</body>
</html>
